name: linguapilot
description: "LingoPilot – asystent nauki słówek z automatyczną sesją w WebView, trwałym słowniczkiem i codziennymi przypomnieniami."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  provider: ^6.1.2
  flutter_inappwebview: ^6.1.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_timezone: ^5.1.1
  wakelock_plus: ^1.2.8
  share_plus: ^10.1.0
  file_picker: ^8.1.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/js/instaling_bot.js
